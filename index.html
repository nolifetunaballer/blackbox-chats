<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>BlackBox Chat</title><style>body{margin:0;background:#0c0a09;color:#eee;font:15px system-ui}*{box-sizing:border-box}button,input{font:inherit}button{cursor:pointer;background:#c9973d;border:0;border-radius:7px;padding:9px;color:#171109;font-weight:700}input{padding:11px;background:#15110e;color:white;border:1px solid #4a4035;border-radius:7px}.auth{max-width:390px;margin:12vh auto;padding:25px;background:#17130f;border:1px solid #40372c;border-radius:13px}.auth input{width:100%;margin:7px 0}.layout{display:grid;grid-template-columns:300px 1fr;height:100vh}.side{padding:15px;border-right:1px solid #40372c;overflow:auto}.main{display:flex;flex-direction:column}.friend{padding:10px;border:1px solid #40372c;border-radius:8px;margin:7px 0;cursor:pointer}.msgs{flex:1;overflow:auto;padding:15px}.msg{max-width:70%;background:#1d1813;padding:9px;margin:7px;border-radius:9px}.mine{margin-left:auto;background:#3b2d18}.send{display:flex;gap:8px;padding:12px;border-top:1px solid #40372c}.send input{flex:1}.muted{color:#aaa}.err{color:#ff9b9b}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{height:42vh}.main{height:58vh}}</style><div id=app></div><script>
let S={user:null,friends:[],sel:null,t:null};const A=async(p,o={})=>{let r=await fetch(p,{credentials:"include",headers:{"Content-Type":"application/json"},...o}),d=await r.json();if(!r.ok)throw Error(d.error);return d};const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function auth(m="login",e=""){app.innerHTML=`<div class=auth><h1>BlackBox</h1><p class=muted>Public chat</p><p class=err>${E(e)}</p><input id=u placeholder=Username><input id=p type=password placeholder=Password>${m=="register"?'<input id=p2 type=password placeholder="Confirm password">':""}<button id=go>${m=="login"?"Sign in":"Create account"}</button><p>${m=="login"?'New? <a id=sw href=#>Create account</a>':'Have an account? <a id=sw href=#>Sign in</a>'}</p></div>`;go.onclick=async()=>{try{if(m=="register"&&p.value!=p2.value)throw Error("Passwords do not match");let d=await A("/api/"+m,{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});S.user=d.user;load()}catch(x){auth(m,x.message)}};sw.onclick=x=>{x.preventDefault();auth(m=="login"?"register":"login")}}
async function load(){let d=await A("/api/friends");S.friends=d.friends;S.inc=d.incoming;render()}
function render(){app.innerHTML=`<div class=layout><aside class=side><b>${E(S.user.username)}</b> <button onclick="logout()">Log out</button><h3>Add friend</h3><input id=add placeholder=Username><button onclick="addf()">Add</button><div>${S.inc.map(x=>`<div class=friend>${E(x.username)} <button onclick="resp(${x.id},'accept')">Accept</button><button onclick="resp(${x.id},'decline')">Decline</button></div>`).join("")}</div><h3>Friends</h3>${S.friends.map(x=>`<div class=friend onclick="pick(${x.id})">${E(x.username)}</div>`).join("")||'<p class=muted>No friends yet</p>'}</aside><main class=main><h3 id=title style="padding:10px;margin:0;border-bottom:1px solid #40372c">Select a friend</h3><div id=msgs class=msgs></div><div class=send><input id=text placeholder="Message..." disabled><button id=send disabled>Send</button></div></main></div>`;send.onclick=sendm;text.onkeydown=e=>e.key=="Enter"&&sendm()}
async function addf(){try{await A("/api/friends/request",{method:"POST",body:JSON.stringify({username:add.value})});load()}catch(e){alert(e.message)}}
async function resp(id,action){await A("/api/friends/respond",{method:"POST",body:JSON.stringify({id,action})});load()}
async function pick(id){S.sel=S.friends.find(x=>x.id==id);title.textContent=S.sel.username;text.disabled=send.disabled=false;await refresh();clearInterval(S.t);S.t=setInterval(refresh,2500)}
async function refresh(){if(!S.sel)return;let d=await A("/api/messages/"+S.sel.id);msgs.innerHTML=d.messages.map(m=>`<div class="msg ${m.sender==S.user.id?"mine":""}"><b>${E(m.sender_name)}</b><br>${E(m.body)}</div>`).join("");msgs.scrollTop=msgs.scrollHeight}
async function sendm(){let b=text.value.trim();if(!b)return;await A("/api/messages/"+S.sel.id,{method:"POST",body:JSON.stringify({body:b})});text.value="";refresh()}
async function logout(){await A("/api/logout",{method:"POST"});clearInterval(S.t);auth()}(async()=>{let d=await A("/api/me");d.user?(S.user=d.user,load()):auth()})()
</script>
