<div id="app"></div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap');

#app, #app * { box-sizing: border-box; font-family: 'Work Sans', sans-serif; }

:root {
  --bg-void: #0c0a09;
  --bg-rail: #060504;
  --bg-panel: #131110;
  --bg-main: #17140f;
  --bg-elevated: #211c17;
  --bg-input: #1c1712;
  --brass: #c9973d;
  --brass-dim: #7a5b25;
  --brass-glow: rgba(201,151,61,0.35);
  --wine: #9a3535;
  --wine-dim: #5e2020;
  --text-primary: #ece5d8;
  --text-secondary: #a89d89;
  --text-faint: #5c5448;
  --border: #2a2420;
  --border-soft: #201c18;
}

#app { width: 100%; min-height: 600px; background: var(--bg-void); color: var(--text-primary); border-radius: 8px; overflow: hidden; }

.headline { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1.5px; }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

button { cursor: pointer; font-family: inherit; }
input, textarea, select { font-family: inherit; }

.bb-scroll::-webkit-scrollbar { width: 6px; }
</style>

// ---------- utilities ----------
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function pairKey(a,b){ return [a,b].sort().join('__'); }
function fmtTime(ts){ const d=new Date(ts); let h=d.getHours(); const m=d.getMinutes().toString().padStart(2,'0'); const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12; return h+':'+m+' '+ap; }
function fmtDay(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
const PALETTE = ['#c9973d','#8b5a3d','#a34e4e','#5a7a6b','#6b6b8b','#8a7a4a','#4a6b7a','#9a6a3d'];
function hashColor(name){ let h=0; for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h); return PALETTE[Math.abs(h)%PALETTE.length]; }
function initial(name){ return (name||'?').charAt(0).toUpperCase(); }

function avatarHTML(nameOrObj, size, opts){
  size = size || 36; opts = opts || {};
  let name, avatar;
  if(typeof nameOrObj === 'string'){ name = nameOrObj; avatar = (State.usersCache[name]||{}).avatar; }
  else { name = nameOrObj.username; avatar = nameOrObj.avatar; }
  const extra = opts.onclick ? ` onclick="${opts.onclick}" style="cursor:pointer;"` : '';
  const ring = opts.status ? statusDot(opts.status, size) : '';
  let inner;
  if(avatar){
    inner = `<img src="${avatar}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;display:block;" />`;
  } else {
    inner = `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${hashColor(name)};display:flex;align-items:center;justify-content:center;font-weight:600;color:#0c0a09;font-size:${Math.floor(size*0.42)}px;">${esc(initial(name))}</div>`;
  }
  return `<div style="position:relative;flex-shrink:0;"${extra}>${inner}${ring}</div>`;
}
function statusDot(status, parentSize){
  const colors = {online:'#c9973d', idle:'#9a7a3d', dnd:'#9a3535', invisible:'#5c5448', offline:'#5c5448'};
  const d = Math.max(9, Math.floor(parentSize*0.28));
  return `<div style="position:absolute;bottom:-1px;right:-1px;width:${d}px;height:${d}px;border-radius:50%;background:${colors[status]||colors.offline};border:2px solid var(--bg-panel);"></div>`;
}

// ---------- storage ----------
async function sGet(key, shared){
  if(shared===undefined) shared = true;
  try { const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared){
  if(shared===undefined) shared = true;
  try { await window.storage.set(key, JSON.stringify(value), shared); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function sDel(key, shared){
  if(shared===undefined) shared = true;
  try { await window.storage.delete(key, shared); return true; } catch(e){ return false; }
}
const SESSION_KEY = 'blackbox-remembered-session';

// ---------- state ----------
const State = {
  user: null,
  view: {type:'home'},
  friends: [],
  servers: {},
  groups: {},
  usersCache: {},
  poll: null,
  authMode: 'login',
  authError: '',
};

async function fetchUser(username){
  if(State.usersCache[username]) return State.usersCache[username];
  const u = await sGet('user:'+username.toLowerCase());
  if(u) State.usersCache[username] = u;
  return u;
}

// ---------- auth ----------
function renderAuth(){
  const isLogin = State.authMode === 'login';
  document.getElementById('app').innerHTML = `
  <div style="min-height:600px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%, #1a1611 0%, #0c0a09 70%);padding:40px 20px;">
    <div style="width:100%;max-width:360px;">
      <div style="text-align:center;margin-bottom:28px;">
        <div style="width:92px;height:92px;border-radius:14px;overflow:hidden;margin:0 auto 14px;box-shadow:0 0 24px var(--brass-glow);border:2px solid var(--brass-dim);">
          <img src="${LOGO_DATA_URI}" style="width:100%;height:100%;object-fit:cover;display:block;" alt="BlackBox" />
        </div>
        <div class="headline" style="font-size:36px;letter-spacing:3px;color:var(--text-primary);">BLACKBOX</div>
        <div style="font-size:12px;color:var(--text-faint);letter-spacing:2px;margin-top:2px;">NO EMAIL. NO NITRO. JUST A ROOM AND A DOOR.</div>
      </div>
      <div style="background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:28px 24px;">
        <div style="font-size:18px;font-weight:600;margin-bottom:18px;">${isLogin?'Sign in':'Create an account'}</div>
        ${State.authError ? `<div style="background:rgba(154,53,53,0.15);border:1px solid var(--wine-dim);color:#e2a3a3;font-size:13px;padding:8px 12px;border-radius:6px;margin-bottom:14px;">${esc(State.authError)}</div>` : ''}
        <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px;">Username</label>
        <input id="auth-username" placeholder="e.g. nightowl" maxlength="20" style="width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text-primary);border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:14px;outline:none;" onkeydown="if(event.key==='Enter')document.getElementById('auth-password').focus()"/>
        <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px;">Password</label>
        <input id="auth-password" type="password" placeholder="••••••••" style="width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text-primary);border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:${isLogin?'20':'14'}px;outline:none;" onkeydown="if(event.key==='Enter'){ ${isLogin?'submitLogin()':"document.getElementById('auth-password2').focus()"} }"/>
        ${!isLogin ? `<label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px;">Confirm password</label>
        <input id="auth-password2" type="password" placeholder="••••••••" style="width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text-primary);border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:20px;outline:none;" onkeydown="if(event.key==='Enter')submitRegister()"/>` : ''}
        <button onclick="${isLogin?'submitLogin()':'submitRegister()'}" style="width:100%;background:var(--brass);border:none;color:#1a1207;font-weight:700;padding:11px;border-radius:6px;font-size:14px;letter-spacing:0.5px;">${isLogin?'Sign in':'Create account'}</button>
        <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-secondary);">
          ${isLogin ? `New here? <a onclick="switchAuth('register')" style="color:var(--brass);cursor:pointer;">Create an account</a>` : `Already have one? <a onclick="switchAuth('login')" style="color:var(--brass);cursor:pointer;">Sign in</a>`}
        </div>
      </div>
      <div style="text-align:center;margin-top:16px;font-size:11px;color:var(--text-faint);">Accounts live in shared storage on this artifact — anyone with this link can see usernames, profiles and messages. Don't use a real password you use elsewhere.</div>
    </div>
  </div>`;
  setTimeout(()=>{ const el=document.getElementById('auth-username'); if(el) el.focus(); },50);
}
window.switchAuth = function(mode){ State.authMode = mode; State.authError=''; renderAuth(); }

window.submitRegister = async function(){
  const uname = (document.getElementById('auth-username').value||'').trim();
  const pass = document.getElementById('auth-password').value||'';
  const pass2 = document.getElementById('auth-password2').value||'';
  if(!/^[a-zA-Z0-9_]{3,20}$/.test(uname)){ State.authError='Username must be 3-20 characters: letters, numbers, underscore only.'; renderAuth(); return; }
  if(pass.length<4){ State.authError='Password must be at least 4 characters.'; renderAuth(); return; }
  if(pass!==pass2){ State.authError='Passwords do not match.'; renderAuth(); return; }
  const key = 'user:'+uname.toLowerCase();
  const existing = await sGet(key);
  if(existing){ State.authError='That username is taken.'; renderAuth(); return; }
  const user = {username:uname, password:pass, bio:'', avatar:null, status:'online', createdAt:Date.now()};
  await sSet(key, user);
  await sSet('friends:'+uname.toLowerCase(), []);
  await sSet('user-servers:'+uname.toLowerCase(), []);
  await sSet('user-groups:'+uname.toLowerCase(), []);
  State.usersCache[uname]=user;
  await sSet(SESSION_KEY, uname, false);
  await bootSession(user);
}

window.submitLogin = async function(){
  const uname = (document.getElementById('auth-username').value||'').trim();
  const pass = document.getElementById('auth-password').value||'';
  if(!uname || !pass){ State.authError='Enter a username and password.'; renderAuth(); return; }
  const user = await sGet('user:'+uname.toLowerCase());
  if(!user || user.password !== pass){ State.authError='Wrong username or password.'; renderAuth(); return; }
  State.usersCache[uname]=user;
  await sSet(SESSION_KEY, user.username, false);
  await bootSession(user);
}

async function bootSession(user){
  State.user = user;
  State.authError = '';
  const uname = user.username.toLowerCase();
  const [friends, serverIds, groupIds] = await Promise.all([
    sGet('friends:'+uname), sGet('user-servers:'+uname), sGet('user-groups:'+uname)
  ]);
  State.friends = friends || [];
  const servers = {}; const groups = {};
  await Promise.all((serverIds||[]).map(async id=>{ const s = await sGet('server:'+id); if(s) servers[id]=s; }));
  await Promise.all((groupIds||[]).map(async id=>{ const g = await sGet('group:'+id); if(g) groups[id]=g; }));
  State.servers = servers; State.groups = groups;
  await Promise.all(State.friends.map(f=>fetchUser(f)));
  State.view = {type:'home'};
  renderApp();
  startPolling();
}

async function logout(){
  stopPolling();
  await sDel(SESSION_KEY, false);
  State.user = null; State.friends=[]; State.servers={}; State.groups={}; State.usersCache={}; State.view={type:'home'};
  renderAuth();
}
window.logout = logout;

// ---------- polling ----------
function startPolling(){
  stopPolling();
  State.poll = setInterval(async ()=>{
    if(!State.user) return;
    await refreshCurrentMessages(true);
  }, 3500);
}
function stopPolling(){ if(State.poll){ clearInterval(State.poll); State.poll=null; } }

function currentMsgKey(){
  const v = State.view;
  if(v.type==='dm') return 'msg:d:'+pairKey(State.user.username, v.username);
  if(v.type==='group') return 'msg:g:'+v.id;
  if(v.type==='server') return 'msg:s:'+v.id+':'+v.channelId;
  return null;
}

async function refreshCurrentMessages(isPoll){
  const key = currentMsgKey();
  if(!key) return;
  const msgs = await sGet(key) || [];
  const box = document.getElementById('messages-list');
  if(!box) return;
  const prevCount = parseInt(box.getAttribute('data-count')||'0');
  if(msgs.length !== prevCount || !isPoll){
    box.innerHTML = renderMessagesHTML(msgs);
    box.setAttribute('data-count', msgs.length);
    const scroller = document.getElementById('messages-scroll');
    if(scroller) scroller.scrollTop = scroller.scrollHeight;
  }
}

function renderMessagesHTML(msgs){
  if(!msgs || msgs.length===0) return `<div style="color:var(--text-faint);font-size:13px;text-align:center;margin-top:40px;">No messages yet. Break the silence.</div>`;
  let out = ''; let lastAuthor=null; let lastTs=0; let lastDay='';
  msgs.forEach(m=>{
    const day = fmtDay(m.ts);
    if(day !== lastDay){
      out += `<div style="text-align:center;color:var(--text-faint);font-size:11px;margin:18px 0 10px;letter-spacing:1px;">${esc(day)}</div>`;
      lastAuthor = null; lastDay = day;
    }
    const grouped = (m.author===lastAuthor) && (m.ts-lastTs < 4*60*1000);
    if(!grouped){
      out += `<div style="display:flex;gap:12px;margin-top:14px;">
        ${avatarHTML(m.author,38,{onclick:`openProfileModal('${esc(m.author)}')`})}
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:baseline;gap:8px;">
            <span onclick="openProfileModal('${esc(m.author)}')" style="font-weight:600;font-size:14px;cursor:pointer;color:${hashColor(m.author)};">${esc(m.author)}</span>
            <span style="font-size:11px;color:var(--text-faint);">${fmtTime(m.ts)}</span>
          </div>
          <div style="font-size:14px;color:var(--text-primary);margin-top:2px;line-height:1.5;word-break:break-word;">${esc(m.content)}</div>
        </div>
      </div>`;
    } else {
      out += `<div style="display:flex;gap:12px;">
        <div style="width:38px;flex-shrink:0;"></div>
        <div style="font-size:14px;color:var(--text-primary);line-height:1.5;word-break:break-word;">${esc(m.content)}</div>
      </div>`;
    }
    lastAuthor = m.author; lastTs = m.ts;
  });
  return out;
}

window.openDM = async function(username){
  await fetchUser(username);
  State.view = {type:'dm', username};
  renderApp();
  await refreshCurrentMessages(false);
}

window.openGroup = async function(id){
  State.view = {type:'group', id};
  renderApp();
  await refreshCurrentMessages(false);
}

window.openServer = async function(id){
  const s = State.servers[id];
  if(!s) return;
  await Promise.all((s.members||[]).map(m=>fetchUser(m)));
  const firstChannel = (s.channels||[])[0];
  State.view = {type:'server', id, channelId: firstChannel?firstChannel.id:null};
  renderApp();
  await refreshCurrentMessages(false);
}

window.openChannel = async function(serverId, channelId){
  State.view = {type:'server', id:serverId, channelId};
  renderApp();
  await refreshCurrentMessages(false);
}

// ---------- sending messages ----------
window.sendMessage = async function(){
  const input = document.getElementById('msg-input');
  if(!input) return;
  const content = input.value.trim();
  if(!content) return;
  input.value='';
  const key = currentMsgKey();
  if(!key) return;
  const msg = {id:uid('m'), author: State.user.username, content, ts: Date.now()};
  const existing = await sGet(key) || [];
  existing.push(msg);
  await sSet(key, existing);
  await refreshCurrentMessages(false);
}

window.openAddFriendModal = function(){
  showModal(`
  <div style="background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;padding:24px;width:340px;">
    <div style="font-weight:600;font-size:16px;margin-bottom:14px;">Add someone</div>
    <div id="addfriend-error" style="color:#e2a3a3;font-size:13px;margin-bottom:8px;"></div>
    <input id="addfriend-username" placeholder="Their exact username" style="width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text-primary);border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:16px;outline:none;" onkeydown="if(event.key==='Enter')submitAddFriend()"/>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button onclick="closeModal()" style="background:none;border:1px solid var(--border);color:var(--text-secondary);padding:8px 14px;border-radius:6px;font-size:13px;">Cancel</button>
      <button onclick="submitAddFriend()" style="background:var(--brass);border:none;color:#1a1207;font-weight:700;padding:8px 14px;border-radius:6px;font-size:13px;">Add</button>
    </div>
  </div>`);
  setTimeout(()=>{ const el=document.getElementById('addfriend-username'); if(el) el.focus(); },30);
}
window.submitAddFriend = async function(){
  const uname = (document.getElementById('addfriend-username').value||'').trim();
  const errBox = document.getElementById('addfriend-error');
  if(!uname){ errBox.textContent='Enter a username.'; return; }
  if(uname.toLowerCase()===State.user.username.toLowerCase()){ errBox.textContent="That's you."; return; }
  const target = await sGet('user:'+uname.toLowerCase());
  if(!target){ errBox.textContent='No user with that username.'; return; }
  const realName = target.username;
  if(State.friends.some(f=>f.toLowerCase()===realName.toLowerCase())){ errBox.textContent='Already added.'; return; }
  State.friends.push(realName);
  await sSet('friends:'+State.user.username.toLowerCase(), State.friends);
  const theirFriends = await sGet('friends:'+realName.toLowerCase()) || [];
  if(!theirFriends.some(f=>f.toLowerCase()===State.user.username.toLowerCase())){
    theirFriends.push(State.user.username);
    await sSet('friends:'+realName.toLowerCase(), theirFriends);
  }
  State.usersCache[realName]=target;
  closeModal();
  renderApp();
}

window.submitCreateServer = async function(){
  const name = (document.getElementById('newserver-name').value||'').trim();
  if(!name) return;
  const id = uid('srv');
  const server = {id, name, icon:null, owner:State.user.username, members:[State.user.username], channels:[{id:uid('ch'), name:'general'}]};

window.leaveServer = async function(serverId){

  s.members = (s.members||[]).filter(m=>m.toLowerCase()!==State.user.username.toLowerCase());

  await sSet('user-servers:'+State.user.username.toLowerCase(), list);
  delete State.servers[serverId];
  closeModal();
  goHome();
}
window.deleteServer = async function(serverId){
  const s = State.servers[serverId];
  for(const m of (s.members||[])){
    const list = (await sGet('user-servers:'+m.toLowerCase()) || []).filter(id=>id!==serverId);
    await sSet('user-servers:'+m.toLowerCase(), list);
  }
  await sDel('server:'+serverId);
  delete State.servers[serverId];
  closeModal();
  goHome();
}

let pendingAvatar = null;
window.handleAvatarUpload = function(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      pendingAvatar = canvas.toDataURL('image/jpeg', 0.82);
      document.getElementById('avatar-preview').innerHTML = `<img src="${pendingAvatar}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;"/>`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  await sSet('user:'+State.user.username.toLowerCase(), State.user);
  State.usersCache[State.user.username] = State.user;
  closeModal();
  renderApp();
}

  document.getElementById('app').innerHTML = `

      </div>
      <div style="color:var(--text-faint);font-size:13px;letter-spacing:1px;">Opening the door...</div>
    </div>
  </div>`;
}

async function initApp(){
  renderLoading();
  let remembered = null;
  try { remembered = await sGet(SESSION_KEY, false); } catch(e){ remembered = null; }
  if(remembered){
    const user = await sGet('user:'+remembered.toLowerCase());
    if(user){
      State.usersCache[remembered] = user;
      await bootSession(user);
      return;
    } else {
      await sDel(SESSION_KEY, false);
    }
  }
  renderAuth();
}

initApp();

})();
